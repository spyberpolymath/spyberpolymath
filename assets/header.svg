<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 310" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Offset block shadow -->
  <rect x="14" y="14" width="890" height="290" fill="#000" rx="18"/>
  <!-- Main sticker card -->
  <rect x="4" y="4" width="890" height="290" fill="#FFD23F" stroke="#000" stroke-width="5" rx="18"/>

  <!-- Decorative shapes -->
  <circle cx="815" cy="62" r="34" fill="#FF5E5B" stroke="#000" stroke-width="4"/>
  <rect x="50" y="40" width="48" height="48" fill="#00C2A8" stroke="#000" stroke-width="4" rx="6" transform="rotate(-12 74 64)"/>
  <polygon points="95,150 125,205 65,205" fill="#B197FC" stroke="#000" stroke-width="4" stroke-linejoin="round" transform="translate(-40 40)"/>
  <circle cx="850" cy="205" r="16" fill="#fff" stroke="#000" stroke-width="4"/>

  <!-- Name (hard shadow + ink) -->
  <text x="453" y="108" text-anchor="middle" font-family="'Arial Black',Impact,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="900" fill="#FF5E5B" letter-spacing="1">Aman Anil</text>
  <text x="450" y="105" text-anchor="middle" font-family="'Arial Black',Impact,'Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="900" fill="#000" letter-spacing="1">Aman Anil</text>

  <!-- Tagline pills -->
  <rect x="145" y="126" width="620" height="30" fill="#fff" stroke="#000" stroke-width="3" rx="15"/>
  <text x="455" y="146" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="800" fill="#000" textLength="580" lengthAdjust="spacingAndGlyphs">FULL STACK ENGINEER  ·  CLOUD SECURITY  ·  OFFENSIVE SECURITY</text>

  <rect x="145" y="165" width="620" height="30" fill="#00C2A8" stroke="#000" stroke-width="3" rx="15"/>
  <text x="455" y="185" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="12" font-weight="800" fill="#000" textLength="580" lengthAdjust="spacingAndGlyphs">FORWARD-DEPLOYED SECURITY ENGINEER  ·  FOUNDER  ·  BUILDER</text>

  <!-- Scripture card -->
  <rect x="124" y="214" width="670" height="72" fill="#000" rx="12"/>
  <rect x="118" y="208" width="670" height="72" fill="#fff" stroke="#000" stroke-width="3" rx="12"/>
  <text x="453" y="232" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" font-style="italic" font-weight="700" fill="#000">"Though you soar like the eagle and make your nest among the stars,</text>
  <text x="453" y="250" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="13" font-style="italic" font-weight="700" fill="#000">even from there I will bring you down," declares the LORD.</text>
  <text x="453" y="271" text-anchor="middle" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="800" fill="#FF5E5B" letter-spacing="1.5">— Obadiah 1:4  🤲🙏</text>
</svg>
