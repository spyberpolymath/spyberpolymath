<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FBF7EE"/>
      <stop offset="100%" stop-color="#F1E9D8"/>
    </linearGradient>
    <linearGradient id="goldline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#B08D57" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#B08D57"/>
      <stop offset="100%" stop-color="#B08D57" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Paper background -->
  <rect width="900" height="250" fill="url(#paper)" rx="14"/>

  <!-- Double gold frame -->
  <rect x="10" y="10" width="880" height="230" fill="none" stroke="#B08D57" stroke-width="1.2" rx="8"/>
  <rect x="16" y="16" width="868" height="218" fill="none" stroke="#B08D57" stroke-width="0.5" opacity="0.5" rx="5"/>

  <!-- Alias kicker -->
  <text x="450" y="46" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="10" fill="#B08D57" letter-spacing="6">S P Y B E R P O L Y M A T H</text>

  <!-- Name -->
  <text x="450" y="94" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="46" font-weight="700" fill="#1C1917" letter-spacing="1">Aman Anil</text>

  <!-- Taglines -->
  <text x="450" y="120" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#6B2D3A" letter-spacing="3">FULL STACK ENGINEER  ·  CLOUD SECURITY  ·  OFFENSIVE SECURITY</text>
  <text x="450" y="139" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#6B2D3A" letter-spacing="3">FORWARD-DEPLOYED SECURITY ENGINEER  ·  FOUNDER  ·  BUILDER</text>

  <!-- Ornamental divider -->
  <rect x="250" y="156" width="400" height="1" fill="url(#goldline)"/>
  <rect x="446" y="152" width="8" height="8" fill="#B08D57" transform="rotate(45 450 156)"/>

  <!-- Scripture -->
  <text x="450" y="182" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#44403C" font-style="italic">"Though you soar like the eagle and make your nest among the stars,</text>
  <text x="450" y="200" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="12.5" fill="#44403C" font-style="italic">even from there I will bring you down," declares the LORD.</text>
  <text x="450" y="222" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="11" fill="#B08D57" letter-spacing="2">— Obadiah 1:4  🤲🙏</text>
</svg>
